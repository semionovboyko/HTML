<!DOCTYPE html>
<html lang="es">

<head>
    <h1>Formulario de incripcion</h1>
    <meta charset="utf-8" />
    <title>JavaScript</title>
    <link rel="stylesheet" href="formulario.css">
    <script type="text/javascript" src="scripts.js"></script>
</head>

<body>

    <div id="contenedor">
        <form action="" name="formulario" onsubmit="return validarFormulario()" method="post">
            <fieldset>
                <legend>Introduce los datos y pulsa comprobar</legend>
                <pre>

                <label for="hora">Hora:</label>
                <input type="texto" id="hora" placeholder="hh:mm:(ss)" pattern="(\d{2}):\1:\1" required=""/>
                
                <label for="nombre">Nombre:</label>
                <input id="nombre" type="text" name="nombre" size="40" maxlength="150" placeholder="Nombre" pattern="^[a-zA-Z]{2,40}+[\s]$"  required="">         

                <label for="apellido">Apellidos:</label>
                <input id="apellido" type="text" name="apellidos" size="40" maxlength="150" placeholder="Apellidos" pattern="^[a-zA-Z]{2,40}( [a-zA-Záéíóúñ]{4,80})$" required="">
                
                <label for="edad">Edad:</label>
                <input type="text" id="edad" placeholder="solo mayor de 18" required=""/>

                <label for="tfno">Telefono:</label>
                <input id="tfno" type="text" name="tfno" placeholder="6|7 y 8 numeritos..." required="">
                
                <label for="curso">Curso:<label>
                <input id="curso" type="number" name="curso" min="1" max="6" pattern="^[1-6]{1}$" placeholder="entre 1 y 6" required="">
                
                <label for="any">Año:<label></label>
                <input id="any" type="number" name="any" min="1970" placeholder="Año de nacimiento" required="">

                <div id="boton">
                <input type="submit" value="Enviar"/>
                </div>
                
            </pre>
            </fieldset>
        </form>
    </div>
</body>

</html>
